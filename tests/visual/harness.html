        if(opts&&opts.levels&&el._rooms().length>1){
          el._rooms().forEach((r,i)=>{r.level=opts.levels[i%opts.levels.length];});
        }
        if(opts&&opts.overlap&&el._rooms().length){
          // deliberately overlapping rooms: the reported case where some of
          // them could not be clicked at all
          el._rooms().forEach((r,i)=>{ r.x=i*40; r.y=i*30; r.w=220; r.h=180; });
        }
        if(opts&&opts.trendFill){
          const sec=el._sections()[0]||{items:[]};
          sec.items.unshift({id:"tfcard",type:"trend",entity_id:"",name:"",size:"xl",
            appearance:{},states:{},actions:{},source:"manual",device_class:"voltage",
            max_series:8,series:[],hours:24,y_min:null,y_max:null});
          el._editing=true;el._selected={kind:"card",sectionId:sec.id,itemId:"tfcard"};
        }
        if(opts&&opts.oscar){
          // Oscar's actual screenshot: four loads, long Italian names, and the
          // declared parent NOT present in the flow card's own device list.
          el._hass.states["sensor.asciugatrice_w"]=S("161",{friendly_name:"Asciugatrice",device_class:"power",unit_of_measurement:"W"});
          el._hass.states["sensor.friggitrice_w"]=S("27.3",{friendly_name:"Friggitrice ad aria",device_class:"power",unit_of_measurement:"W"});
          el._hass.states["sensor.cantinetta_w"]=S("25.3",{friendly_name:"Cantinetta Potenza",device_class:"power",unit_of_measurement:"W"});
          el._hass.states["sensor.presa_cucina_w"]=S("60",{friendly_name:"Presa cucina",device_class:"power",unit_of_measurement:"W"});
          el._dashboard.hierarchy={"sensor.friggitrice_w":"sensor.presa_cucina_w"};
          const card=el._sections().flatMap(x=>x.items||[]).find(i=>i.type==="energyflow");
          if(card){
            card.flow=card.flow||{};
            // the parent is deliberately absent here
            card.flow.devices=[{entity:"sensor.asciugatrice_w",name:"Asciugatrice",icon:"",parent:null},
                               {entity:"sensor.friggitrice_w",name:"Friggitrice ad aria",icon:"",parent:null},
                               {entity:"sensor.cantinetta_w",name:"Cantinetta Potenza",icon:"",parent:null}];
            el._flowOpen=el._flowOpen||{};el._flowOpen[card.id]=true;
          }
        }
        if(opts&&opts.hierarchy){
          // the parent is declared ONLY in the dashboard-wide map, never on the
          // flow card's own device list: that is the case that used to draw the
          // two loads side by side
          el._dashboard.hierarchy={"sensor.friggitrice_potenza":"sensor.presa_cucina_potenza"};
          const card=el._sections().flatMap(x=>x.items||[]).find(i=>i.type==="energyflow");
          if(card){
            card.flow=card.flow||{};
            card.flow.devices=[{entity:"sensor.presa_cucina_potenza",name:"Presa cucina",icon:"",parent:null},
                               {entity:"sensor.friggitrice_potenza",name:"Friggitrice ad aria",icon:"",parent:null}];
            el._flowOpen=el._flowOpen||{};el._flowOpen[card.id]=true;
          }
        }
        if(opts&&opts.thermostat){
          const sec=el._sections()[0]||{items:[]};
          sec.items.unshift({id:"thcard",type:"thermostat",entity_id:"",name:"",size:"xl",
            appearance:{},states:{},actions:{},units:[],manual:[],
            show_manual:true,show_extras:true});
          // chosen explicitly: nothing enters the card from a name guess
          sec.items[0].manual=["input_boolean.automazioni_cdz_disattivate"];
          if(opts.manualOn){
            el._hass.states["input_boolean.automazioni_cdz_disattivate"].state="on";
          }
          if(opts.selectThermo){el._editing=true;el._selected={kind:"card",sectionId:sec.id,itemId:"thcard"};}
        }
        if(opts&&opts.alarm){
          const sec=el._sections()[0]||{items:[]};
          sec.items.unshift({id:"alcard",type:"control",entity_id:"alarm_control_panel.allarme",
            name:"",size:"md",appearance:{},states:{},actions:{}});
          if(opts.alarmState){
            el._hass.states["alarm_control_panel.allarme"].state=opts.alarmState;
          }
        }
        if(opts&&opts.comfort){
          const sec=el._sections()[0]||{items:[]};
          sec.items.unshift({id:"cfcard",type:"comfort",entity_id:"",name:"",size:"xl",
            appearance:{},states:{},actions:{},rooms:[],bands:{},filter:""});
          if(opts.selectComfort){el._editing=true;el._selected={kind:"card",sectionId:sec.id,itemId:"cfcard"};}
        }
        if(opts&&opts.lightsOn!==undefined&&el._rooms().length){
          // first room lit to a known level, second deliberately dark, so the
          // two can be compared against each other in the same screenshot
          const r0=el._rooms()[0], r1=el._rooms()[1];
          el._hass.states["light.scena_a"]={entity_id:"light.scena_a",
            state:opts.lightsOn?"on":"off",
            attributes:{friendly_name:"Scena A",brightness:opts.lightsOn||255,
              color_temp_kelvin:2700,supported_color_modes:["color_temp"]}};
          r0.entities=["light.scena_a"];
          if(r1){
            el._hass.states["light.scena_b"]={entity_id:"light.scena_b",state:"off",
              attributes:{friendly_name:"Scena B",supported_color_modes:["brightness"]}};
            r1.entities=["light.scena_b"];
          }
        }
        if(opts&&opts.rotate&&el._rooms().length){ el._rooms()[0].rotation=35; }
        if(opts&&opts.balcony&&el._rooms().length){
          // the reported real case: one wall, a French window, railings on the
          // other three sides
          const r=el._rooms()[el._rooms().length-1];
          r.title="Balcone"; r.walls=["wall","glass","railing","railing"];
        }
        if(opts&&opts.lshape&&el._rooms().length){
          el._rooms()[0].points=[[0,0],[1,0],[1,0.5],[0.5,0.5],[0.5,1],[0,1]];
        }
        if(opts&&opts.focusRoom&&el._rooms().length){
          el._signature="";el.render();
          el._focusRoom(el._rooms()[0].id);
        }
        if(opts&&opts.extraPages){
          opts.extraPages.forEach(function(t,i){
            el._dashboard.pages.push({id:"xp"+i,type:"sections",title:t,
              icon:"mdi:view-dashboard-outline",layout:{type:"grid",columns:12,gap:16},sections:[]});
          });
        }
        if(opts&&opts.manySections){
          var pg=el._dashboard.pages[el._pageIndex];
          pg.sections=opts.manySections.map(function(t,i){
            return {id:"xs"+i,title:t,icon:"mdi:shape-outline",accent:null,collapsed:true,items:[]};
          });
        }
        el._signature="";el.render();
        setTimeout(function(){
          // materialised LAST, after the registry has certainly arrived:
          // _comfortRooms returns nothing without it, and a silently empty
          // list would make the test pass for the wrong reason.
          if(opts&&opts.manualComfort){
            el._sections().forEach(function(sec){
              (sec.items||[]).forEach(function(it){
                if(it.type!=="comfort")return;
                it.rooms=el._comfortRooms(it).map(function(r){
                  return {temperature:r.temperature,humidity:r.humidity||null,name:r.name||"",icon:r.icon||""};});
              });
            });
            el._signature="";el.render();
          }
          r(true);
        },350);
      };
      wait();
    };
    setTimeout(go,300);
  });
};
window.__ready=true;
</script></body></html>
