<!doctype html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><style>

:root{--primary-background-color:#0b1119;--primary-text-color:#e8f4ff;--card-background-color:#111a24;
--divider-color:#24313f;--primary-color:#00e5ff;--accent:#00e5ff}

<script>
// Minimal <ha-icon> stand-in: renders a filled rounded square sized by
// --mdc-icon-size, so layout/spacing is representative without MDI fonts.
class HaIcon extends HTMLElement{
  static get observedAttributes(){return["icon"]}
  connectedCallback(){this._p()} attributeChangedCallback(){this._p()}
  _p(){this.style.display="inline-block";
    this.style.width="var(--mdc-icon-size,24px)";this.style.height="var(--mdc-icon-size,24px)";
    this.style.verticalAlign="middle";this.style.borderRadius="4px";
    this.style.background="currentColor";this.style.opacity=this.style.opacity||"1";}
}
customElements.define("ha-icon",HaIcon);
</script>
<script type="module">
import "./panel.js";

const S=(state,attrs)=>({state,attributes:attrs||{}});
const states={
 "light.soggiorno_faretti":S("on",{friendly_name:"Faretti Soggiorno"}),
 "light.soggiorno_piantana":S("off",{friendly_name:"Piantana"}),
 "climate.cdz_storm":S("dry",{friendly_name:"CDZ Storm",current_temperature:26.1,temperature:24}),
 "sensor.soggiorno_temp":S("26.3",{friendly_name:"Soggiorno Temperatura",device_class:"temperature",unit_of_measurement:"°C"}),
 "sensor.soggiorno_hum":S("47",{friendly_name:"Soggiorno Umidità",device_class:"humidity",unit_of_measurement:"%"}),
 "switch.interruttore_fem_luci":S("on",{friendly_name:"FEM + LUCI"}),
 "sensor.fem_potenza":S("760",{friendly_name:"Potenza Totale",device_class:"power",unit_of_measurement:"W"}),
 "binary_sensor.porta_ingresso":S("on",{friendly_name:"Porta ingresso",device_class:"door"}),
 "climate.thermostat":S("heat_cool",{friendly_name:"Termostato",current_temperature:22.4,temperature:21}),
 "sensor.camera_temp":S("21.8",{friendly_name:"Camera Temperatura",device_class:"temperature",unit_of_measurement:"°C"}),
 "light.camera_abat":S("off",{friendly_name:"Abat-jour"}),
 "cover.camera_tapparella":S("open",{friendly_name:"Tapparella",current_position:47}),
 "sensor.bagno_temp":S("24.8",{friendly_name:"T&U Bagno Temperatura",device_class:"temperature",unit_of_measurement:"°C"}),
 "sensor.bagno_hum":S("62",{friendly_name:"T&U Bagno Umidità",device_class:"humidity",unit_of_measurement:"%"}),
 "light.bagno_specchio":S("off",{friendly_name:"Luce specchio"}),
 "switch.phon":S("off",{friendly_name:"Presa Phon"}),
 "light.cucina_sottopensile":S("on",{friendly_name:"Sottopensile"}),
 "sensor.cucina_potenza":S("23.4",{friendly_name:"Presa Cucina Potenza",device_class:"power",unit_of_measurement:"W"}),
 "switch.piano_induzione":S("off",{friendly_name:"Piano Induzione"}),
 "light.balcone_relay":S("off",{friendly_name:"Relè luce balcone"}),
 "sensor.fotovoltaico_potenza":S("2840",{friendly_name:"Fotovoltaico Potenza",device_class:"power",unit_of_measurement:"W"}),
 "sensor.rete_potenza":S("-1120",{friendly_name:"Rete Potenza",device_class:"power",unit_of_measurement:"W"}),
 "sensor.batteria_potenza":S("-450",{friendly_name:"Batteria Potenza",device_class:"power",unit_of_measurement:"W"}),
 "sensor.lavatrice_potenza":S("820",{friendly_name:"Lavatrice",device_class:"power",unit_of_measurement:"W"}),
 "sensor.asciugatrice_potenza2":S("310",{friendly_name:"Asciugatrice",device_class:"power",unit_of_measurement:"W"}),
 "sensor.nas_potenza":S("64",{friendly_name:"NAS & Modem",device_class:"power",unit_of_measurement:"W"}),
 "sensor.casa_kw":S("1.27",{friendly_name:"Consumo Casa",device_class:"power",unit_of_measurement:"kW"}),
 "sensor.v_l1":S("231.4",{friendly_name:"Tensione L1",device_class:"voltage",unit_of_measurement:"V"}),
 "sensor.v_l2":S("256.2",{friendly_name:"Tensione L2",device_class:"voltage",unit_of_measurement:"V"}),
 "sensor.v_l3":S("229.8",{friendly_name:"Tensione L3",device_class:"voltage",unit_of_measurement:"V"}),
 "sensor.i_l1":S("4.85",{friendly_name:"Corrente L1",device_class:"current",unit_of_measurement:"A"}),
 "sensor.i_l2":S("2.14",{friendly_name:"Corrente L2",device_class:"current",unit_of_measurement:"A"}),
 "sensor.t_cpu":S("52.1",{friendly_name:"Raspberry CPU",device_class:"temperature",unit_of_measurement:"°C"}),
 "sensor.t_inv":S("91.3",{friendly_name:"Inverter",device_class:"temperature",unit_of_measurement:"°C"}),
 "sensor.t_batt":S("34.6",{friendly_name:"Pacco batteria",device_class:"temperature",unit_of_measurement:"°C"}),
 "sensor.freq":S("50.01",{friendly_name:"Frequenza rete",device_class:"frequency",unit_of_measurement:"Hz"}),
 "sensor.cosphi":S("0.82",{friendly_name:"Fattore di potenza",device_class:"power_factor",unit_of_measurement:""}),
 "weather.casa_oscar":S("sunny",{friendly_name:"Casa Oscar",temperature:26.4,temperature_unit:"°C",wind_speed:4.1,wind_speed_unit:"km/h",wind_bearing:142,pressure:1014,pressure_unit:"hPa",supported_features:3}),
 "person.oscar":S("home",{friendly_name:"Oscar"}),
 "person.lilly":S("not_home",{friendly_name:"Lilly Bonny"}),
 "alarm_control_panel.allarme":S("disarmed",{friendly_name:"Allarme"}),
 "update.cyborg":S("on",{friendly_name:"Cyborg Dashboard"}),
 "update.matter":S("on",{friendly_name:"Matter Server"}),
 "media_player.salotto":S("playing",{friendly_name:"Salotto"}),
 "cover.camera_tapparella2":S("open",{friendly_name:"Tapparella studio"}),
 "sensor.balcone_temp":S("28.9",{friendly_name:"Balcone Temperatura",device_class:"temperature",unit_of_measurement:"°C"}),
 "sensor.energia_rete":S("1310",{friendly_name:"Energia prelevata",device_class:"energy",state_class:"total_increasing",unit_of_measurement:"kWh"}),
 "sensor.energia_immessa":S("486",{friendly_name:"Energia immessa",device_class:"energy",state_class:"total_increasing",unit_of_measurement:"kWh"}),
 "sensor.energia_pv":S("1082",{friendly_name:"Energia prodotta",device_class:"energy",state_class:"total_increasing",unit_of_measurement:"kWh"}),
 "sensor.energia_pdc":S("612",{friendly_name:"Pompa di calore",device_class:"energy",state_class:"total_increasing",unit_of_measurement:"kWh"}),
 "sensor.energia_lavatrice":S("141",{friendly_name:"Lavatrice",device_class:"energy",state_class:"total_increasing",unit_of_measurement:"kWh"}),
 "sensor.energia_forno":S("74",{friendly_name:"Forno",device_class:"energy",state_class:"total_increasing",unit_of_measurement:"kWh"}),
 "vacuum.robot":S("cleaning",{friendly_name:"Robot aspirapolvere",battery_level:64}),
};
const AREA=[["soggiorno","Soggiorno",null],["camera_da_letto","Camera da letto",null],
 ["bagno","Bagno","mdi:toilet"],["cucina","Cucina",null],["balcone","Balcone","mdi:balcony"]];
const MAP={soggiorno:["light.soggiorno_faretti","light.soggiorno_piantana","climate.cdz_storm","sensor.soggiorno_temp","sensor.soggiorno_hum","switch.interruttore_fem_luci","sensor.fem_potenza","binary_sensor.porta_ingresso"],
 camera_da_letto:["climate.thermostat","sensor.camera_temp","light.camera_abat","cover.camera_tapparella"],
 bagno:["sensor.bagno_temp","sensor.bagno_hum","light.bagno_specchio","switch.phon"],
 cucina:["light.cucina_sottopensile","sensor.cucina_potenza","switch.piano_induzione"],
 balcone:["light.balcone_relay","sensor.balcone_temp"]};

const entReg=[];
for(const [aid,ents] of Object.entries(MAP))
  for(const e of ents) entReg.push({entity_id:e,area_id:aid,device_id:null,disabled_by:null,hidden_by:null});

let saved=null;
const hass={states,
  callWS:async(m)=>{
    if(m.type==="cyborg_dashboard/get") return {dashboard:window.__DASH__};
    if(m.type==="cyborg_dashboard/save"){saved=m.dashboard;return {saved:true,revision:1}}
    if(m.type==="config/area_registry/list") return AREA.map(([area_id,name,icon])=>({area_id,name,icon}));
    if(m.type==="config/device_registry/list") return [];
    if(m.type==="config/entity_registry/list") return entReg;
    if(m.type==="history/history_during_period") return {};
    if(m.type==="cyborg_dashboard/notifications") return {available:true,notifications:[
      {id:"cy-9",ts:new Date(Date.now()-90*1000).toISOString(),source:"sent",channel:"telegram",
       channel_label:"Telegram",title:"Allarme sicurezza",message:"Movimento rilevato in salotto alle 03:14. Videocamera TY1.",service:"notify.send_message"},
      {id:"cy-8",ts:new Date(Date.now()-42*60000).toISOString(),source:"sent",channel:"mobile",
       channel_label:"App iPhone di Oscar",title:"Lavatrice",message:"Ciclo terminato.",service:"notify.mobile_app_iphone_di_oscar"},
      {id:"cy-7",ts:new Date(Date.now()-3*3600000).toISOString(),source:"received",channel:"telegram",
       channel_label:"Telegram",title:"Oscar",message:"/stato",service:"telegram_command"},
      {id:"cy-6",ts:new Date(Date.now()-9*3600000).toISOString(),source:"sent",channel:"telegram",
       channel_label:"Telegram",title:"Fotovoltaico",message:"Produzione giornaliera 24,8 kWh, autoconsumo 61%.",service:"telegram_bot.send_message"}]};
    if(m.type==="cyborg_dashboard/notifications/clear") return {cleared:true};
    if(m.type==="energy/get_prefs") return {energy_sources:[
      {type:"grid",stat_energy_from:"sensor.energia_rete",stat_energy_to:"sensor.energia_immessa",number_energy_price:0.31},
      {type:"solar",stat_energy_from:"sensor.energia_pv"}],
      device_consumption:[{stat_consumption:"sensor.energia_pdc",name:"Pompa di calore"},
        {stat_consumption:"sensor.energia_lavatrice",name:"Lavatrice"},
        {stat_consumption:"sensor.energia_forno",name:"Forno"}]};
    if(m.type==="recorder/statistics_during_period"){
      // a statistic's sum is a monotonic meter: the harness returns a first
      // and a last bucket so the panel computes last-minus-first as it does live
      const TOT={"sensor.energia_rete":[1000,1310],"sensor.energia_immessa":[400,486],
        "sensor.energia_pv":[900,1082],"sensor.energia_pdc":[500,612],
        "sensor.energia_lavatrice":[120,141],"sensor.energia_forno":[60,74]};
      const out={};
      for(const id of m.statistic_ids||[]){
        const t=TOT[id]; if(!t) continue;
        out[id]=[{start:m.start_time,sum:t[0]},{start:m.end_time,sum:t[1]}];
      }
      return out;
    }
    return {};
  },
  callService:(d,s,data)=>{window.__CALLS__=(window.__CALLS__||[]).concat([d+"."+s+" "+JSON.stringify(data)])},
  connection:{subscribeMessage:(cb,msg)=>{
    if(msg.type==="weather/subscribe_forecast"){
      setTimeout(()=>cb({type:"daily",forecast:[
        {datetime:"2026-08-22T12:00:00+02:00",condition:"sunny",temperature:29,templow:19},
        {datetime:"2026-08-23T12:00:00+02:00",condition:"partlycloudy",temperature:27,templow:18},
        {datetime:"2026-08-24T12:00:00+02:00",condition:"rainy",temperature:23,templow:17},
        {datetime:"2026-08-25T12:00:00+02:00",condition:"lightning-rainy",temperature:21,templow:16},
        {datetime:"2026-08-26T12:00:00+02:00",condition:"cloudy",temperature:24,templow:17}]}),60);
    }
    if(msg.type==="persistent_notification/subscribe"){
      setTimeout(()=>cb({type:"current",notifications:{
        n1:{notification_id:"n1",title:"Backup non riuscito",message:"L'ultimo backup automatico è fallito: spazio insufficiente sul NAS."},
        n2:{notification_id:"n2",title:"Nuovo dispositivo Matter",message:"Rilevato un dispositivo non configurato in salotto."}}}),80);
    }
    return Promise.resolve(()=>{});
  }}};

window.__mount=(dash,opts)=>{
  window.__DASH__=dash;
  document.body.innerHTML="";
  const el=document.createElement("cyborg-dashboard");
  document.body.appendChild(el);
  el.hass=hass;
  window.__EL__=el;
  return new Promise(r=>{
    const go=()=>{
      if(opts&&opts.pageIndex!==undefined){el._pageIndex=opts.pageIndex;}
      el._signature="";el.render();
      // the registry loads asynchronously; wait for it before generating rooms
      const wait=()=>{
        // only the floorplan page loads the registry; waiting for it on a
        // sections page would spin forever
        if((opts&&opts.autoRooms)&&!el._registry){setTimeout(wait,60);return;}
        if(opts&&opts.editing){el._editing=true;}
        if(opts&&opts.autoRooms){el._autoRooms();}
        if(opts&&opts.autoCompose){el._autoCompose(true);}
        if(opts&&opts.overview){el._composeOverview();}
        if(opts&&opts.flowCard){
          const sec=el._sections().find(x=>x.title==="Energia")||el._sections()[0];
          sec.items.unshift({id:"flowcard",type:"energyflow",entity_id:"",name:"",size:"xl",
            appearance:{},states:{},actions:{},flow:{
              solar:"sensor.fotovoltaico_potenza",grid:"sensor.rete_potenza",battery:"sensor.batteria_potenza",
              invert_grid:false,invert_battery:false,
              devices:[{entity:"sensor.lavatrice_potenza",name:"Lavatrice"},
                       {entity:"sensor.asciugatrice_potenza2",name:"Asciugatrice"},
                       {entity:"sensor.nas_potenza",name:"NAS & Modem"}]}});
          if(opts.selectFlow){el._selected={kind:"card",sectionId:sec.id,itemId:"flowcard"};}
          if(opts.openTree){el._flowOpen={flowcard:true};}
          if(opts.monitor){sec.items.push({id:"moncard",type:"monitor",entity_id:"",name:"",size:"lg",
            appearance:{},states:{},actions:{},grid_entity:"sensor.rete_potenza",limit_w:3300,groups:[],max_per_group:8});}
        }
        if(opts&&opts.economy){
          const sec=el._sections().find(x=>x.title==="Energia")||el._sections()[0];
          sec.items.unshift({id:"ecocard",type:"economy",entity_id:"",name:"",size:"xl",
            appearance:{},states:{},actions:{},period:"month",
            grid_import:"sensor.energia_rete",grid_export:"sensor.energia_immessa",solar:"sensor.energia_pv",
            price_import:0.31,price_export:0.10,
            devices:[{entity:"sensor.energia_pdc",name:"Pompa di calore",icon:"",kind:"load"},
                     {entity:"sensor.energia_lavatrice",name:"Lavatrice",icon:"",kind:"load"},
                     {entity:"sensor.energia_forno",name:"Forno",icon:"",kind:"load"},
                     {entity:"sensor.energia_pv",name:"Fotovoltaico",icon:"",kind:"source"}]});
          if(opts.selectEconomy){el._selected={kind:"card",sectionId:sec.id,itemId:"ecocard"};}
        }
        if(opts&&opts.view){Object.assign(el._page().view,opts.view);}
        if(opts&&opts.selectRoom&&el._rooms().length){el._selected={kind:"room",roomId:el._rooms()[0].id};}
        // multi-storey / polygon / focus scenarios
        if(opts&&opts.levels&&el._rooms().length>1){
          el._rooms().forEach((r,i)=>{r.level=opts.levels[i%opts.levels.length];});
        }
        if(opts&&opts.balcony&&el._rooms().length){
          // the reported real case: one wall, a French window, railings on the
          // other three sides
          const r=el._rooms()[el._rooms().length-1];
          r.title="Balcone"; r.walls=["wall","glass","railing","railing"];
        }
        if(opts&&opts.lshape&&el._rooms().length){
          el._rooms()[0].points=[[0,0],[1,0],[1,0.5],[0.5,0.5],[0.5,1],[0,1]];
        }
        if(opts&&opts.focusRoom&&el._rooms().length){
          el._signature="";el.render();
          el._focusRoom(el._rooms()[0].id);
        }
        el._signature="";el.render();
        setTimeout(()=>r(true),350);
      };
      wait();
    };
    setTimeout(go,300);
  });
};
window.__ready=true;
</script></body></html>
